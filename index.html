    h1 {

      font-weight: 700;
      text-transform: uppercase;

    h2 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 28px 0 8px;
      color: #333333;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid #111111;
      margin-bottom: 24px;
    }

    .cell {
      padding: 12px;
      border-right: 1px solid #111111;
    }

    .cell:last-child {
      border-right: none;
    }

    .label {
      font-size: 11px;
      color: #555555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .val {
      font-size: 16px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #111111;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #dddddd;
      text-align: left;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      color: #444444;
      border-bottom: 1px solid #111111;
      background: #f5f5f5;
    }

    th.num, td.num {
      text-align: right;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .meta {
      margin-top: 16px;
      font-size: 11px;
      color: #666666;
    }
  </style>

  <script>
    function usd(n, signed = false) {
      const v = Number(n || 0);
      const s = signed ? (v >= 0 ? "+" : "-") : (v < 0 ? "-" : "");
      return s + "$" + Math.abs(v).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function pct(n) {
      const v = Number(n || 0);
      return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
    }

    async function load() {
      const ts = Date.now();
      let reb = window.EMBEDDED_REBALANCE, hist = window.EMBEDDED_HISTORY;
      try {
        const [r1, r2] = await Promise.all([
          fetch(`./last_rebalance_report.json?t=${ts}`),
          fetch(`./daily_history.json?t=${ts}`)
        ]);
        if (r1.ok && r2.ok) {
          reb = await r1.json();
          hist = await r2.json();
        }
      } catch (e) {}

      const latest = hist[hist.length - 1] || {};
      const cashIn = Number(latest.initial_cost_usd || 10002.63);
      const totalNow = Number(reb.total_tracked_equity_usd || latest.tracked_total_usd || 0);
      const plUsd = Number(latest.total_pl_usd ?? (totalNow - cashIn));
      const plPct = Number(latest.total_pl_pct ?? ((plUsd / cashIn) * 100));

      document.getElementById("sum-cash").textContent = usd(cashIn);
      document.getElementById("sum-total").textContent = usd(totalNow);
      document.getElementById("sum-pl").textContent = `${usd(plUsd, true)} (${pct(plPct)})`;

      document.getElementById("daily-rows").innerHTML = [...hist].reverse().map(d => {
        const c = d.initial_cost_usd || 10002.63;
        return `
          <tr>
            <td>${d.date}</td>
            <td class="num">${usd(c)}</td>
            <td class="num">${usd(d.tracked_total_usd)}</td>
            <td class="num">${usd(d.daily_pl_usd, true)} (${pct(d.daily_pl_pct)})</td>
          </tr>
        `;
      }).join("");

      const list = (reb.portfolio_snapshot || []).slice().sort((a, b) => b.equity_usd - a.equity_usd);
      document.getElementById("stock-rows").innerHTML = list.map(s => {
        const cost = s.cost_basis_usd || 1000;
        const pl = s.pl_usd !== undefined ? s.pl_usd : (s.equity_usd - cost);
        return `
          <tr>
            <td>${s.symbol}</td>
            <td class="num">${usd(cost)}</td>
            <td class="num">${usd(s.equity_usd)}</td>
            <td class="num">${usd(pl, true)} (${pct(s.total_return_pct)})</td>
          </tr>
        `;
      }).join("");

      if (reb.timestamp) {
        document.getElementById("updated-at").textContent = "Updated: " + new Date(reb.timestamp).toLocaleString();
      }
    }

    load();
    setInterval(load, 60000);
  </script>
